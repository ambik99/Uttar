    // --- Clean JSON Extractor for Multi-Model Responses ---
    function extractJsonObject(raw) {
      if (!raw) throw new Error("Empty AI response received.");
      const cleaned = raw.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
      try {
        return JSON.parse(cleaned);
      } catch {
        const firstBrace = cleaned.indexOf("{");
        const lastBrace = cleaned.lastIndexOf("}");
        if (firstBrace !== -1 && lastBrace > firstBrace) {
          return JSON.parse(cleaned.slice(firstBrace, lastBrace + 1));
        }
        throw new Error("Could not parse structured JSON from AI model output.");
      }
    }

                content: "You are a CBSE curriculum expert. Respond ONLY with a valid JSON object matching the exact schema requested. Do not wrap in markdown or add extra commentary."
              },
              {
                role: "user",
                content: `${prompt}\n\nReturn valid JSON strictly matching this schema:\n${schemaGuide}`
              }
            ]
          })
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`OpenRouter API Error (${res.status}): ${errText}`);
        }

        const data = await res.json();
        const rawText = data?.choices?.[0]?.message?.content;
        return extractJsonObject(rawText);
      }

      // Direct Google Gemini API mode
      const effectiveModelId = model.includes("/") ? model.split("/").pop() : model;
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(effectiveModelId)}:generateContent?key=${encodeURIComponent(cleanKey)}`;
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ role: "user", parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema,
            temperature: 0.35
          }
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Gemini API Error (${res.status}): ${errText}`);
      }

      const data = await res.json();
      const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      return extractJsonObject(rawText);
    }

    // --- Offline Fallback Questionnaire Generator ---
    function generateOfflineQuestionnaire({ classLevel, subject, count, selectedFormats, passageMode }) {
      const safeCount = Math.min(Math.max(1, count), subject.maxQuestions);
      const baseBank = QUESTION_BANK[subject.id] || [];
      const activeFormats = selectedFormats.length > 0 ? selectedFormats : ["mcq", "ar", "competency", "short", "long"];

      let filtered = baseBank.filter((item) => {
        if (!activeFormats.includes(item.type)) return false;
        if (subject.isLanguage && item.passageType) {
          if (passageMode === "unseen" && item.passageType !== "Unseen Passage") return false;
          if (passageMode === "seen" && item.passageType !== "Seen Passage") return false;
        }
        return true;
      });
      if (filtered.length === 0) filtered = baseBank.length > 0 ? baseBank : [];

      const generated = [];
      for (let i = 0; i < safeCount; i++) {
        if (filtered.length > 0) {
          const template = filtered[i % filtered.length];
          const cycle = Math.floor(i / filtered.length);
          generated.push({
            ...template,
            id: `${subject.id}-q-${i + 1}`,
            qNumber: i + 1,
            question: cycle === 0 ? template.question : `[Set ${cycle + 1} Practice] ${template.question}`
          });
        } else {
          const fmtId = activeFormats[i % activeFormats.length];
          const fmtMeta = QUESTION_FORMATS.find((f) => f.id === fmtId) || QUESTION_FORMATS[0];
          const isSubjective = fmtId === "short" || fmtId === "long";
          generated.push({
            id: `${subject.id}-q-${i + 1}`,
            qNumber: i + 1,
            type: fmtId,
            marks: fmtMeta.marks,
            section: fmtMeta.section,
            topic: `${subject.name} Core Unit ${(i % 5) + 1}`,
            passageType: subject.isLanguage ? (passageMode === "seen" ? "Seen Passage" : "Unseen Passage") : fmtId === "competency" ? "Case Study" : null,
            passage: subject.isLanguage || fmtId === "competency" ? `CBSE Competency / Reading Extract for ${subject.name} (Unit ${(i % 5) + 1}).` : null,
            assertion: fmtId === "ar" ? `In ${subject.name}, fundamental principles of Unit ${(i % 4) + 1} govern standard experimental outcomes.` : null,
            reason: fmtId === "ar" ? `CBSE competency guidelines emphasize conceptual cause-and-effect reasoning over rote memorization.` : null,
            question: fmtId === "ar" ? "Evaluate Assertion (A) and Reason (R) carefully:" : isSubjective ? `Explain the core principle and real-world application of ${subject.name} (Unit ${(i % 5) + 1}) with suitable examples as per CBSE Marking Scheme.` : `Which statement best aligns with NCERT Class ${classLevel} ${subject.name} for Unit ${(i % 5) + 1}?`,
            options: isSubjective ? null : fmtId === "ar" ? [
              "Both Assertion (A) and Reason (R) are true and R is the correct explanation of A.",
              "Both A and R are true but R is NOT the correct explanation of A.",
              "Assertion (A) is true but Reason (R) is false.",
              "Assertion (A) is false but Reason (R) is true."
            ] : [
              "Direct proportional relationship verified under NCERT standard conditions",
              "Inverse variation independent of boundary constraints",
              "Constant invariant state across all non-equilibrium phases",
              "None of the above under standard CBSE guidelines"
            ],
            correctIndex: isSubjective ? null : 0,
            explanation: `As per NCERT Class ${classLevel} ${subject.name} guidelines, standard boundary conditions establish a direct conceptual relationship for Unit ${(i % 5) + 1}.`,
            modelAnswer: isSubjective ? `1. Core Definition: State the fundamental NCERT definition clearly.\n2. Analytical Explanation: Break down the mechanism/derivation step-by-step.\n3. Conclusion/Example: Conclude with a textbook-verified application.` : null,
            valuePoints: isSubjective ? ["Accurate NCERT definition & terminology (1M)", "Step-by-step reasoning / diagram / example (2M)"] : null
          });
        }
      }
      return generated;
    }

                            <div className="text-xs">
                              <span className="font-bold text-slate-700">Your Answer: </span>
                              <span className="text-slate-600">{userAns || "No written answer submitted."}</span>
                            </div>
                            <div className="text-xs whitespace-pre-line text-slate-800 bg-white p-3 rounded-lg border border-slate-200">
                              <div className="font-extrabold text-indigo-700 mb-1">CBSE Model Solution:</div>
                              {q.modelAnswer}
                            </div>
                            <div className="flex flex-wrap items-center gap-2 pt-1">
                              <span className="text-xs font-bold text-slate-700">Award Marks (CBSE Rubric):</span>
                              {Array.from({ length: q.marks + 1 }, (_, m) => (
                                <button
                                  key={m}
                                  onClick={() => handleSelfScoreChange(activeResult.id, q.id, m)}
                                  className={`px-3 py-1 rounded-lg text-xs font-extrabold border ${
                                    ((activeResult.subjectiveScores || {})[q.id] ?? 0) === m
                                      ? "bg-indigo-600 text-white border-indigo-600"
                                      : "bg-white text-slate-700 border-slate-300"
                                  }`}
                                >
                                  {m}M
                                </button>
                              ))}
                            </div>
                          </div>
                        ) : (
                          <div className="text-xs sm:text-sm space-y-1.5 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                            <div>
                              <span className="font-bold text-emerald-700">Correct Answer: </span>
                              <span className="font-semibold text-slate-900">{q.options?.[q.correctIndex]}</span>
                            </div>
                            <div className="text-slate-600">
                              <span className="font-bold text-slate-800">Uttar (Explanation): </span>
                              {q.explanation}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ==================== 5. SOLUTIONS & CONCEPT LINKS TAB ==================== */}
            {activeTab === "solutions" && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                        Uttar (उत्तर) — Detailed Solutions & Internet Concept Links
                      </h1>
                      <p className="text-xs sm:text-sm text-slate-500">
                        Step-by-step CBSE marking scheme solutions paired with verified NCERT, DIKSHA & Khan Academy links.
                      </p>
                    </div>

                    {savedPapers.length > 0 && (
                      <select
                        value={activeResult ? activeResult.id : ""}
                        onChange={(e) => setActiveResultId(e.target.value)}
                        className="px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm font-bold bg-slate-50 text-slate-800"
                      >
                        {savedPapers.map((p) => (
                          <option key={p.id} value={p.id}>
                            Class {p.classLevel} • {p.subject.name} ({p.totalScore}/{p.maxMarks}M) — {p.submittedAt}
                          </option>
                        ))}
                      </select>
                    )}
                  </div>

                  {activeResult && (
                    <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pt-1">
                      {[
                        { id: "all", label: `All Solutions (${activeResult.questions.length})` },
                        { id: "incorrect", label: "Needs Review" },
                        { id: "subjective", label: "Subjective Marking Scheme" },
                        { id: "links", label: "Subject Concept Hub" }
                      ].map((f) => (
                        <button
                          key={f.id}
                          onClick={() => setSolutionFilter(f.id)}
                          className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border transition ${
                            solutionFilter === f.id
                              ? "bg-indigo-600 text-white border-indigo-600"
                              : "bg-slate-50 text-slate-700 border-slate-200 hover:border-indigo-300"
                          }`}
                        >
                          {f.label}
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                {!activeResult ? (
                  <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center space-y-3">
                    <p className="text-sm font-semibold text-slate-600">
                      No solved questionnaire yet. Complete a practice paper to unlock full step-by-step solutions and topic links!
                    </p>
                    <button
                      onClick={() => setActiveTab("practice")}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                    >
                      Start a Practice Paper
                    </button>
                  </div>
                ) : solutionFilter === "links" ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {Array.from(new Set(activeResult.questions.map((q) => q.topic))).map((topic) => (
                      <div key={topic} className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
                        <div className="text-xs font-extrabold uppercase tracking-wider text-indigo-600">
                          {activeResult.subject.name} • Concept Topic
                        </div>
                        <h3 className="font-extrabold text-slate-900 text-base">{topic}</h3>
                        <div className="space-y-2">
                          {getTopicConceptLinks(activeResult.subject, topic).map((link, i) => (
                            <a
                              key={i}
                              href={link.url}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 transition group"
                            >
                              <div>
                                <div className="text-xs font-bold text-slate-900 group-hover:text-indigo-700">
                                  {link.title}
                                </div>
                                <div className="text-[11px] text-slate-500">{link.source} • {link.tag}</div>
                              </div>
                              <Icon name="external" className="w-4 h-4 text-slate-400 group-hover:text-indigo-600 shrink-0" />
                            </a>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="space-y-4">
                    {activeResult.questions
                      .filter((q) => {
                        const isSub = q.type === "short" || q.type === "long";
                        if (solutionFilter === "subjective") return isSub;
                        if (solutionFilter === "incorrect") {
                          return !isSub && activeResult.userAnswers[q.id] !== q.correctIndex;
                        }
                        return true;
                      })
                      .map((q) => {
                        const isSub = q.type === "short" || q.type === "long";
                        const topicLinks = getTopicConceptLinks(activeResult.subject, q.topic).slice(0, 3);
                        return (
                          <div key={q.id} className="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 space-y-4 shadow-sm">
                            <div className="flex flex-wrap items-center justify-between gap-2">
                              <div className="flex items-center gap-2">
                                <span className="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs font-extrabold">
                                  Q.{q.qNumber}
                                </span>
                                <span className="text-xs font-bold text-slate-600">{q.topic}</span>
                              </div>
                              <span className="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700">
                                {q.section} • {q.marks}M
                              </span>
                            </div>

                            <p className="font-bold text-slate-900 text-base">{q.question}</p>

                            <div className="p-4 rounded-xl bg-emerald-50/70 border border-emerald-200 space-y-2">
                              <div className="text-xs font-extrabold uppercase tracking-wider text-emerald-800">
                                Complete Solution (उत्तर)
                              </div>
                              {isSub ? (
                                <>
                                  <p className="text-sm text-slate-800 whitespace-pre-line leading-relaxed">
                                    {q.modelAnswer}
                                  </p>
                                  {q.valuePoints && q.valuePoints.length > 0 && (
                                    <div className="pt-2 border-t border-emerald-200/70">
                                      <div className="text-xs font-bold text-emerald-900 mb-1">
                                        CBSE Marking Scheme Value Points:
                                      </div>
                                      <ul className="list-disc list-inside text-xs text-emerald-900 space-y-0.5">
                                        {q.valuePoints.map((vp, idx) => (
                                          <li key={idx}>{vp}</li>
                                        ))}
                                      </ul>
                                    </div>
                                  )}
                                </>
                              ) : (
                                <>
                                  <div className="text-sm font-extrabold text-emerald-950">
                                    Correct Option: {q.options?.[q.correctIndex]}
                                  </div>
                                  <p className="text-xs sm:text-sm text-slate-700 leading-relaxed">
                                    {q.explanation}
                                  </p>
                                </>
                              )}
                            </div>

                            <div className="pt-2 space-y-2">
                              <div className="flex items-center gap-1.5 text-xs font-extrabold text-slate-700">
                                <Icon name="globe" className="w-4 h-4 text-indigo-600" />
                                <span>Further Understanding on the Internet ({q.topic}):</span>
                              </div>
                              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                {topicLinks.map((lnk, idx) => (
                                  <a
                                    key={idx}
                                    href={lnk.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="p-2.5 rounded-xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 flex items-center justify-between gap-2 transition group"
                                  >
                                    <div className="min-w-0">
                                      <div className="text-xs font-bold text-slate-800 group-hover:text-indigo-700 truncate">
                                        {lnk.source}
                                      </div>
                                      <div className="text-[11px] text-slate-500 truncate">{lnk.tag}</div>
                                    </div>
                                    <Icon name="external" className="w-3.5 h-3.5 text-slate-400 group-hover:text-indigo-600 shrink-0" />
                                  </a>
                                ))}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                )}
              </div>
            )}

            {/* ==================== 6. SAVED PAPERS ARCHIVE TAB ==================== */}
            {activeTab === "saved" && (
              <div className="space-y-4">
                <div>
                  <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Saved Solved Papers</h1>
                  <p className="text-xs sm:text-sm text-slate-500">
                    Every attempted CBSE questionnaire is saved locally for instant revision and sharing.
                  </p>
                </div>

                {savedPapers.length === 0 ? (
                  <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center space-y-3">
                    <p className="text-sm font-semibold text-slate-600">You haven't solved any papers yet.</p>
                    <button
                      onClick={() => setActiveTab("practice")}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                    >
                      Generate Your First Paper
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {savedPapers.map((paper) => (
                      <div key={paper.id} className="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col justify-between gap-4 shadow-sm">
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-1">
                            <span className="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">
                              Class {paper.classLevel} • Code {paper.subject.code}
                            </span>
                            <span className="text-xs text-slate-400">{paper.submittedAt}</span>
                          </div>
                          <h3 className="font-extrabold text-slate-900 text-lg">{paper.subject.name}</h3>
                          <div className="mt-3 grid grid-cols-3 gap-2 text-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <div>
                              <div className="text-[11px] text-slate-500">Score</div>
                              <div className="text-sm font-extrabold text-slate-900">{paper.totalScore}/{paper.maxMarks}</div>
                            </div>
                            <div>
                              <div className="text-[11px] text-slate-500">Accuracy</div>
                              <div className="text-sm font-extrabold text-emerald-700">{paper.accuracy}%</div>
                            </div>
                            <div>
                              <div className="text-[11px] text-slate-500">Time</div>
                              <div className="text-sm font-extrabold text-slate-900">{formatTime(paper.timeTaken)}</div>
                            </div>
                          </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
                          <button
                            onClick={() => {
                              setActiveResultId(paper.id);
                              setActiveTab("solutions");
                            }}
                            className="flex-1 py-2 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold"
                          >
                            View Solutions
                          </button>
                          <button
                            onClick={() => handleShareScore(paper)}
                            className="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold"
                          >
                            Share
                          </button>
                          <button
                            onClick={() => setSavedPapers((prev) => prev.filter((p) => p.id !== paper.id))}
                            className="p-2 rounded-xl text-rose-600 hover:bg-rose-50"
                            title="Delete Saved Paper"
                          >
                            <Icon name="trash" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ==================== 7. COMPARE & SHARE WITH FRIENDS TAB ==================== */}
            {activeTab === "compare" && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-4">
                  <div>
                    <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                      Compare Performance with Friends
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-500">
                      Share your UTTAR challenge code or paste a friend's code to compare CBSE scores side-by-side.
                    </p>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={friendCodeInput}
                      onChange={(e) => setFriendCodeInput(e.target.value)}
                      placeholder="Paste friend's code (e.g. UTTAR-10-041-12OF14-ANANYA)"
                      className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm font-mono focus:outline-none focus:border-indigo-600"
                    />
                    <button
                      onClick={handleImportFriendCode}
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold"
                    >
                      Add Friend Score
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {activeResult && (
                    <div className="bg-indigo-50/70 rounded-2xl border-2 border-indigo-600 p-5 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-indigo-600 text-white">
                          You ({studentName})
                        </span>
                        <button
                          onClick={() => handleShareScore(activeResult)}
                          className="text-xs font-bold text-indigo-700 flex items-center gap-1 hover:underline"
                        >
                          <Icon name="copy" className="w-3.5 h-3.5" /> Copy Code
                        </button>
                      </div>
                      <h3 className="font-extrabold text-slate-900 text-lg">
                        Class {activeResult.classLevel} • {activeResult.subject.name}
                      </h3>
                      <div className="space-y-1.5">
                        <div className="flex justify-between text-xs font-bold">
                          <span>Score: {activeResult.totalScore}/{activeResult.maxMarks}</span>
                          <span>{Math.round((activeResult.totalScore / activeResult.maxMarks) * 100)}%</span>
                        </div>
                        <div className="w-full h-2.5 bg-indigo-200 rounded-full overflow-hidden">
                          <div
                            className="h-full bg-indigo-600 rounded-full"
                            style={{ width: `${Math.min(100, Math.round((activeResult.totalScore / activeResult.maxMarks) * 100))}%` }}
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {friendComparisons.map((friend) => {
                    const pct = Math.min(100, Math.round((friend.score / friend.maxMarks) * 100));
                    return (
                      <div key={friend.id} className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3 shadow-sm">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                            Friend • {friend.name}
                          </span>
                          <span className="text-xs text-slate-400">Class {friend.classLevel}</span>
                        </div>
                        <h3 className="font-extrabold text-slate-900 text-lg">{friend.subjectName}</h3>
                        <div className="space-y-1.5">
                          <div className="flex justify-between text-xs font-bold">
                            <span>Score: {friend.score}/{friend.maxMarks}</span>
                            <span>{pct}%</span>
                          </div>
                          <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-emerald-500 rounded-full"
                              style={{ width: `${pct}%` }}
                            />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* Mobile Bottom Navigation Bar */}
          {activeTab !== "exam" && (
            <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 grid grid-cols-5 py-1.5">
              {[
                { id: "practice", label: "Practice", icon: "book" },
                { id: "notes", label: "AI Notes", icon: "notes" },
                { id: "solutions", label: "Solutions", icon: "lightbulb" },
                { id: "saved", label: "Saved", icon: "folder" },
                { id: "compare", label: "Compare", icon: "users" }
              ].map((item) => {
                const active = activeTab === item.id || (item.id === "practice" && activeTab === "scorecard");
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex flex-col items-center justify-center py-1 gap-0.5 text-[10px] font-bold ${
                      active ? "text-indigo-600" : "text-slate-500"
                    }`}
                  >
                    <Icon name={item.icon} className="w-5 h-5" />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<UttarApp />);
  </script>
</body>
</html>
