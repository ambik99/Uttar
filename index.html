  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Standard CBSE Assertion & Reasoning Choices ---
    const STANDARD_AR_OPTIONS = [
      "Both Assertion (A) and Reason (R) are true and R is the correct explanation of A.",
      "Both Assertion (A) and Reason (R) are true but R is NOT the correct explanation of A.",
      "Assertion (A) is true but Reason (R) is false.",
      "Assertion (A) is false but Reason (R) is true."
    ];

    // --- Robust Question Normalizer (Fixes missing A/R options & On-Spot Report Answers/Explanations) ---
    function normalizeQuestion(rawQ, idx = 0, subject = null) {
      if (!rawQ || typeof rawQ !== "object") return rawQ;

      const rawType = String(rawQ.type || "mcq").toLowerCase().trim();
      let type = rawType;
      if (rawType.includes("assert") || rawType === "a-r" || rawType === "a/r") type = "ar";
      else if (rawType.includes("comp") || rawType.includes("case")) type = "competency";
      else if (rawType.includes("short") || rawType === "vsa" || rawType === "sa") type = "short";
      else if (rawType.includes("long") || rawType === "la") type = "long";
      else if (!["mcq", "ar", "competency", "short", "long"].includes(rawType)) {
        type = (rawQ.assertion || rawQ.reason) ? "ar" : "mcq";
      }

      const isSubjective = type === "short" || type === "long";

      // Extract Assertion & Reason if embedded inside question string
      let assertion = rawQ.assertion || rawQ.assertionText || rawQ.statementA || "";
      let reason = rawQ.reason || rawQ.reasonText || rawQ.statementR || "";
      let questionText = String(rawQ.question || "").trim();

      if (type === "ar" && (!assertion || !reason) && questionText) {
        const aMatch = questionText.match(/Assertion\s*(?:\(A\))?\s*[:\-]\s*([\s\S]*?)(?=Reason\s*(?:\(R\))?\s*[:\-]|$)/i);
        const rMatch = questionText.match(/Reason\s*(?:\(R\))?\s*[:\-]\s*([\s\S]*?)$/i);
        if (aMatch && aMatch[1].trim()) assertion = aMatch[1].trim();
        if (rMatch && rMatch[1].trim()) reason = rMatch[1].trim();
        if (assertion && reason) {
          questionText = "Evaluate Assertion (A) and Reason (R) carefully and choose the correct option:";
        }
      }

      // Normalize Options Array
      let options = null;
      if (!isSubjective) {
        let rawOpts = Array.isArray(rawQ.options)
          ? rawQ.options.map((o) => String(o ?? "").trim()).filter(Boolean)
          : [];

        if (rawOpts.length === 0 && (rawQ.optionA || rawQ.optionB || rawQ.a || rawQ.b)) {
          rawOpts = [
            rawQ.optionA ?? rawQ.a,
            rawQ.optionB ?? rawQ.b,
            rawQ.optionC ?? rawQ.c,
            rawQ.optionD ?? rawQ.d
          ].map((o) => String(o ?? "").trim()).filter(Boolean);
        }

        if (type === "ar") {
          options = rawOpts.length >= 4 ? rawOpts.slice(0, 4) : [...STANDARD_AR_OPTIONS];
        } else {
          options = rawOpts.length >= 2
            ? rawOpts
            : [
                "Option A — Direct conceptual relationship as per NCERT",
                "Option B — Inverse relationship under standard conditions",
                "Option C — Independent of boundary constraints",
                "Option D — None of the above"
              ];
        }
      }

      // Resolve correctIndex from numeric, 1-based, letter ("A"/"B"/"C"/"D"), or option text
      let correctIndex = null;
      if (!isSubjective && options && options.length > 0) {
        const rawAns =
          rawQ.correctIndex !== undefined && rawQ.correctIndex !== null ? rawQ.correctIndex :
          rawQ.correct_index !== undefined && rawQ.correct_index !== null ? rawQ.correct_index :
          rawQ.answerIndex !== undefined && rawQ.answerIndex !== null ? rawQ.answerIndex :
          rawQ.correctOptionIndex !== undefined && rawQ.correctOptionIndex !== null ? rawQ.correctOptionIndex :
          rawQ.correctOption !== undefined && rawQ.correctOption !== null ? rawQ.correctOption :
          rawQ.correctAnswer !== undefined && rawQ.correctAnswer !== null ? rawQ.correctAnswer :
          rawQ.answer !== undefined && rawQ.answer !== null ? rawQ.answer : 0;

        if (typeof rawAns === "number" && !Number.isNaN(rawAns)) {
          if (rawAns >= 0 && rawAns < options.length) correctIndex = Math.floor(rawAns);
          else if (rawAns >= 1 && rawAns <= options.length) correctIndex = Math.floor(rawAns) - 1;
        } else if (typeof rawAns === "string") {
          const trimmed = rawAns.trim();
          const cleanLetter = trimmed.replace(/^(?:option|choice|ans|answer)\s*[:\-]?\s*/i, "").replace(/[\(\)\[\]\.]/g, "").trim();

          if (/^[0-9]+$/.test(cleanLetter)) {
            const num = parseInt(cleanLetter, 10);
            if (num >= 0 && num < options.length) correctIndex = num;
            else if (num >= 1 && num <= options.length) correctIndex = num - 1;
          } else if (/^[A-Da-d]$/.test(cleanLetter)) {
            const letterIdx = cleanLetter.toUpperCase().charCodeAt(0) - 65;
            if (letterIdx >= 0 && letterIdx < options.length) correctIndex = letterIdx;
          } else {
            const exactIdx = options.findIndex(
              (opt) => opt.toLowerCase().replace(/^[a-d][\)\.\:\-\s]+/i, "").trim() === trimmed.toLowerCase()
            );
            if (exactIdx !== -1) correctIndex = exactIdx;
          }
        }

        if (correctIndex === null || correctIndex < 0 || correctIndex >= options.length) {
          correctIndex = 0;
        }
      }

      // Resolve Uttar (Explanation) from all possible field aliases
      const rawExplanation = [
        rawQ.explanation,
        rawQ.uttar,
        rawQ.uttarExplanation,
        rawQ.solution,
        rawQ.reasoning,
        rawQ.rationale,
        rawQ.answerExplanation,
        rawQ.detailedSolution
      ].find((val) => typeof val === "string" && val.trim().length > 0);

      const explanation = isSubjective
        ? (rawExplanation || rawQ.modelAnswer || "")
        : (rawExplanation
            ? rawExplanation.trim()
            : `As per CBSE NCERT curriculum standards, Option (${String.fromCharCode(65 + correctIndex)}) "${options[correctIndex]}" is the verified correct answer for ${rawQ.topic || (subject ? subject.name : "this concept")}.`);

      const modelAnswer = isSubjective
        ? (String(rawQ.modelAnswer || rawExplanation || "").trim() ||
            "1. State the exact NCERT definition and core principle.
2. Provide step-by-step derivation, diagram, or analytical points.
3. Conclude with a verified board exam example.")
        : (rawQ.modelAnswer || null);

      return {
        ...rawQ,
        id: rawQ.id || `${subject?.id || "cbse"}-q-${idx + 1}`,
        qNumber: rawQ.qNumber || idx + 1,
        type,
        marks: Number(rawQ.marks) || (type === "long" ? 5 : type === "competency" ? 4 : type === "short" ? 3 : 1),
        section: rawQ.section || (type === "long" ? "Section D" : type === "competency" ? "Section E" : type === "short" ? "Section C" : "Section A"),
        topic: rawQ.topic || (subject ? `${subject.name} Core Concept` : "CBSE Core Concept"),
        assertion: type === "ar" ? assertion : (rawQ.assertion || null),
        reason: type === "ar" ? reason : (rawQ.reason || null),
        question: questionText || (type === "ar" ? "Evaluate Assertion (A) and Reason (R) carefully:" : "Select the most appropriate option as per NCERT guidelines:"),
        options,
        correctIndex,
        explanation,
        modelAnswer,
        valuePoints: Array.isArray(rawQ.valuePoints) ? rawQ.valuePoints : null
      };
    }

        trash: <><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>,
        globe: <><circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></>,
        key: <><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4" /></>,
        layers: <><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></>,
        logOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></>,
        bookOpen: <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /><line x1="6" y1="8" x2="8" y2="8" /><line x1="6" y1="12" x2="8" y2="12" /><line x1="16" y1="8" x2="18" y2="8" /><line x1="16" y1="12" x2="18" y2="12" /></>
      };
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || null}

    // --- Clean JSON Extractor for Multi-Model Responses ---
    function extractJsonObject(raw) {
      if (!raw) throw new Error("Empty AI response received.");
      const cleaned = raw.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim();
      try {
        return JSON.parse(cleaned);
      } catch {
        const firstBrace = cleaned.indexOf("{");
        const lastBrace = cleaned.lastIndexOf("}");
        if (firstBrace !== -1 && lastBrace > firstBrace) {
          return JSON.parse(cleaned.slice(firstBrace, lastBrace + 1));
        }
        throw new Error("Could not parse structured JSON from AI model output.");
      }
    }

      // Direct Google Gemini API mode (with automatic fallback across active Gemini endpoints)
      const primaryModelId = model.includes("/") ? model.split("/").pop() : model;
      const candidateModels = Array.from(new Set([
        primaryModelId,
        "gemini-3.8-flash",
        "gemini-3.6-flash",
        "gemini-3.5-flash-lite",
        "gemini-3-flash-preview"
      ]));

      let lastError = null;
      for (const candidateModel of candidateModels) {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(candidateModel)}:generateContent?key=${encodeURIComponent(cleanKey)}`;
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema,
              temperature: 0.35
            }
          })
        });

        if (res.ok) {
          const data = await res.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          return extractJsonObject(rawText);
        }

        const errText = await res.text();
        lastError = new Error(`Gemini API Error (${res.status} on ${candidateModel}): ${errText}`);
        if (res.status !== 404) {
          throw lastError;
        }
      }
      throw lastError;
    }

    // --- Offline Fallback Questionnaire Generator ---
    function generateOfflineQuestionnaire({ classLevel, subject, count, selectedFormats, passageMode }) {
      const safeCount = Math.min(Math.max(1, count), subject.maxQuestions);
      const baseBank = QUESTION_BANK[subject.id] || [];
      const activeFormats = selectedFormats.length > 0 ? selectedFormats : ["mcq", "ar", "competency", "short", "long"];

      let filtered = baseBank.filter((item) => {
        if (!activeFormats.includes(item.type)) return false;
        if (subject.isLanguage && item.passageType) {
          if (passageMode === "unseen" && item.passageType !== "Unseen Passage") return false;
          if (passageMode === "seen" && item.passageType !== "Seen Passage") return false;
        }
        return true;
      });
      if (filtered.length === 0) filtered = baseBank.length > 0 ? baseBank : [];

      const generated = [];
      for (let i = 0; i < safeCount; i++) {
        if (filtered.length > 0) {
          const template = filtered[i % filtered.length];
          const cycle = Math.floor(i / filtered.length);
          generated.push(normalizeQuestion({
            ...template,
            id: `${subject.id}-q-${i + 1}`,
            qNumber: i + 1,
            question: cycle === 0 ? template.question : `[Set ${cycle + 1} Practice] ${template.question}`
          }, i, subject));
        } else {
          const fmtId = activeFormats[i % activeFormats.length];
          const fmtMeta = QUESTION_FORMATS.find((f) => f.id === fmtId) || QUESTION_FORMATS[0];
          const isSubjective = fmtId === "short" || fmtId === "long";
          generated.push(normalizeQuestion({
            id: `${subject.id}-q-${i + 1}`,
            qNumber: i + 1,
            type: fmtId,
            marks: fmtMeta.marks,
            section: fmtMeta.section,
            topic: `${subject.name} Core Unit ${(i % 5) + 1}`,
            passageType: subject.isLanguage ? (passageMode === "seen" ? "Seen Passage" : "Unseen Passage") : fmtId === "competency" ? "Case Study" : null,
            passage: subject.isLanguage || fmtId === "competency" ? `CBSE Competency / Reading Extract for ${subject.name} (Unit ${(i % 5) + 1}).` : null,
            assertion: fmtId === "ar" ? `In ${subject.name}, fundamental principles of Unit ${(i % 4) + 1} govern standard experimental outcomes.` : null,
            reason: fmtId === "ar" ? `CBSE competency guidelines emphasize conceptual cause-and-effect reasoning over rote memorization.` : null,
            question: fmtId === "ar" ? "Evaluate Assertion (A) and Reason (R) carefully:" : isSubjective ? `Explain the core principle and real-world application of ${subject.name} (Unit ${(i % 5) + 1}) with suitable examples as per CBSE Marking Scheme.` : `Which statement best aligns with NCERT Class ${classLevel} ${subject.name} for Unit ${(i % 5) + 1}?`,
            options: isSubjective ? null : fmtId === "ar" ? [...STANDARD_AR_OPTIONS] : [
              "Direct proportional relationship verified under NCERT standard conditions",
              "Inverse variation independent of boundary constraints",
              "Constant invariant state across all non-equilibrium phases",
              "None of the above under standard CBSE guidelines"
            ],
            correctIndex: isSubjective ? null : 0,
            explanation: `As per NCERT Class ${classLevel} ${subject.name} guidelines, standard boundary conditions establish a direct conceptual relationship for Unit ${(i % 5) + 1}.`,
            modelAnswer: isSubjective ? `1. Core Definition: State the fundamental NCERT definition clearly.
2. Analytical Explanation: Break down the mechanism/derivation step-by-step.
3. Conclusion/Example: Conclude with a textbook-verified application.` : null,
            valuePoints: isSubjective ? ["Accurate NCERT definition & terminology (1M)", "Step-by-step reasoning / diagram / example (2M)"] : null
          }, i, subject));
        }
      }
      return generated;
    }

            deepExplanation: `Detailed NCERT Analysis of ${targetTopic.title}: In CBSE Class ${classLevel} ${selectedSubject.name} (${selectedChapter}), examiners test both conceptual precision and multi-step reasoning. Start your board answer by defining the core terms explicitly, stating all governing conditions or assumptions, and connecting cause-and-effect logically across each step.`,
            stepByStepDerivation: [
              `Step 1 — Identify Given Parameters & NCERT Law: Extract all numerical quantities, variables, or textual clues and write the exact governing principle for ${targetTopic.title}.`,
              `Step 2 — Systematic Substitution & Transformation: Apply standard SI units / grammatical or analytical rules cleanly without skipping intermediate steps.`,
              `Step 3 — Final Verification & Board Conclusion: Box the final numerical result with units (or highlight the concluding inference) as expected in the CBSE Marking Scheme.`
            ],
            boardExamQuestions: [
              {
                q: `[CBSE 3M Short Answer] Explain the core principle of ${targetTopic.title} with a neat labelled diagram or suitable example.`,
                ans: `1. State the exact NCERT definition (${targetTopic.definition.slice(0, 120)}...). 2. Draw a clean labelled diagram or write the governing equation (${targetTopic.keyFormula}). 3. Conclude with the worked application.`
              },
              {
                q: `[CBSE 1M Assertion-Reason / Competency] What happens when boundary conditions in ${targetTopic.title} are altered?`,
                ans: `Apply the direct/inverse proportionality from ${targetTopic.keyFormula} to determine the exact shift in output.`
              }
            ],
            commonMistakes: [
              "Omitting SI units, sign conventions, or proper labelling in diagrams (loses 0.5–1 mark).",
              "Writing vague summaries instead of exact NCERT keywords required by the CBSE Marking Scheme."
            ]
          };

          const updatedTopics = currentChapterNotes.topics.map((t, i) =>
            i === topicIdx ? { ...t, elaboration: fallbackElab } : t
          );
          setChapterNotesCache((prev) => ({
            ...prev,
            [activeNotesKey]: { ...currentChapterNotes, topics: updatedTopics }
          }));
          setCopyFeedback("Generated structured CBSE elaboration (connect AI key for custom deep-dive).");
          setTimeout(() => setCopyFeedback(""), 3500);
          return;
        }

        setNotesError("");
        setIsElaboratingTopic(true);
        try {
          const prompt = `You are a senior CBSE Board Examiner and NCERT subject specialist for Class ${classLevel} ${selectedSubject.name} (Code ${selectedSubject.code}).
Chapter: ${selectedChapter}
Topic to Elaborate: ${targetTopic.title}
Existing Summary: ${targetTopic.definition}

Generate a comprehensive, deeply elaborated study module for this specific topic so a student can score 100% on any 1M, 3M, 4M Case-Based, or 5M Long Answer CBSE board question:
1. 'deepExplanation': Detailed, thorough multi-paragraph NCERT conceptual breakdown covering underlying principles, edge cases, exceptions, and real-world/laboratory context.
2. 'stepByStepDerivation': An array of 3 to 5 clear sequential steps (derivation, proof, mechanism, or analytical framework).
3. 'boardExamQuestions': An array of 2 to 3 likely CBSE Board Exam questions (mix of 3M/5M/Competency) with complete model answers ('q' and 'ans').
4. 'commonMistakes': An array of 2 to 3 specific pitfalls students make in CBSE board exams on this topic and how to avoid them.`;

          const schema = {
            type: "OBJECT",
            properties: {
              deepExplanation: { type: "STRING" },
              stepByStepDerivation: { type: "ARRAY", items: { type: "STRING" } },
              boardExamQuestions: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    q: { type: "STRING" },
                    ans: { type: "STRING" }
                  },
                  required: ["q", "ans"]
                }
              },
              commonMistakes: { type: "ARRAY", items: { type: "STRING" } }
            },
            required: ["deepExplanation", "stepByStepDerivation", "boardExamQuestions", "commonMistakes"]
          };

          const elabResult = await callUniversalAiStructured({
            provider: aiProvider,
            apiKey: apiKey.trim(),
            model: effectiveModel,
            prompt,
            responseSchema: schema
          });

          if (elabResult?.deepExplanation) {
            const updatedTopics = currentChapterNotes.topics.map((t, i) =>
              i === topicIdx ? { ...t, elaboration: elabResult } : t
            );
            setChapterNotesCache((prev) => ({
              ...prev,
              [activeNotesKey]: {
                ...currentChapterNotes,
                isAiGenerated: true,
                topics: updatedTopics
              }
            }));
          }
        } catch (err) {
          setNotesError(`Could not generate elaborated content: ${err.message}`);
        } finally {
          setIsElaboratingTopic(false);
        }
      };

      const handleTerminateExamWithoutSaving = () => {
        setExitConfirmOpen(false);
        setActivePaper(null);
        setUserAnswers({});
        setMarkedReview({});
        setSecondsElapsed(0);
        setCurrentIdx(0);
        setActiveTab("practice");
        setCopyFeedback("Practice test terminated. Returned to subject selection.");
        setTimeout(() => setCopyFeedback(""), 3500);
      };

      const handleSubmitExam = () => {
        if (!activePaper) return;
        let autoScore = 0;
        let maxMarks = 0;
        let objectiveTotal = 0;
        let objectiveCorrect = 0;

        const normalizedQuestions = activePaper.questions.map((rawQ, idx) =>
          normalizeQuestion(rawQ, idx, activePaper.subject)
        );

        normalizedQuestions.forEach((q) => {
          maxMarks += q.marks;
          if (q.type !== "short" && q.type !== "long") {
            objectiveTotal += 1;
            if (userAnswers[q.id] === q.correctIndex) {
              autoScore += q.marks;
              objectiveCorrect += 1;
            }
          }
        });

        const accuracy = objectiveTotal > 0 ? Math.round((objectiveCorrect / objectiveTotal) * 100) : 100;
        const challengeCode = `UTTAR-${activePaper.classLevel}-${activePaper.subject.code}-${autoScore}OF${maxMarks}-${studentName.replace(/\s+/g, "").slice(0, 6).toUpperCase()}`;

        const resultRecord = {
          id: activePaper.id,
          studentName,
          classLevel: activePaper.classLevel,
          subject: activePaper.subject,
          questions: normalizedQuestions,
          userAnswers,
          subjectiveScores: {},
          autoScore,
          totalScore: autoScore,
          maxMarks,
          accuracy,
          timeTaken: secondsElapsed,
          submittedAt: new Date().toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }),
          challengeCode
        };

        setSavedPapers((prev) => [resultRecord, ...prev]);
        setActiveResultId(resultRecord.id);
        setActiveTab("scorecard");
      };

      const handleSelfScoreChange = (paperId, questionId, awardedMarks) => {
        setSavedPapers((prev) =>
          prev.map((paper) => {
            if (paper.id !== paperId) return paper;
            const updatedSubScores = { ...(paper.subjectiveScores || {}), [questionId]: awardedMarks };
            const subTotal = Object.values(updatedSubScores).reduce((sum, val) => sum + Number(val || 0), 0);
            const newTotal = paper.autoScore + subTotal;
            const newChallengeCode = `UTTAR-${paper.classLevel}-${paper.subject.code}-${newTotal}OF${paper.maxMarks}-${paper.studentName.replace(/\s+/g, "").slice(0, 6).toUpperCase()}`;
            return { ...paper, subjectiveScores: updatedSubScores, totalScore: newTotal, challengeCode: newChallengeCode };
          })
        );
      };

      const activeResult = useMemo(() => {
        const found = savedPapers.find((p) => p.id === activeResultId) || savedPapers[0] || null;
        if (!found) return null;
        return {
          ...found,
          questions: (found.questions || []).map((q, idx) => normalizeQuestion(q, idx, found.subject))
        };

      const handleShareScore = (paper) => {
        const msg = `🎯 Uttar (उत्तर) CBSE Class ${paper.classLevel} Challenge!
Subject: ${paper.subject.name} (${paper.subject.code})
Score: ${paper.totalScore}/${paper.maxMarks} | Accuracy: ${paper.accuracy}% | Time: ${formatTime(paper.timeTaken)}
Compare Code: ${paper.challengeCode}`;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(msg);

          setTimeout(() => setCopyFeedback(""), 3500);

      const handleImportFriendCode = () => {

        const match = raw.match(/UTTAR-(10|12)-([A-Z0-9]+)-(\d+)OF(\d+)-([A-Z0-9]+)/i);
        if (match) {

          const subj = (CBSE_SUBJECTS[cls] || []).find((s) => s.code === code) || { name: `CBSE Code ${code}` };
          const scoreNum = Number(sc);
          const maxNum = Number(mx) || 1;
          setFriendComparisons((prev) => [
            { id: `friend-${Date.now()}`, name: fname, subjectName: subj.name, classLevel: cls, score: scoreNum, maxMarks: maxNum, accuracy: Math.round((scoreNum / maxNum) * 100), timeTaken: 360 },
            ...prev

          setFriendCodeInput("");
        } else {

      const filteredSubjects = useMemo(() => {
        if (classLevel === "10" || streamFilter === "All") return currentSubjects;
        return currentSubjects.filter((s) => s.stream === streamFilter);

      const groupedExamSections = useMemo(() => {
        if (!activePaper) return {};
        return activePaper.questions.reduce((acc, q, idx) => {
          const sec = q.section || "Section A";

          return acc;

      return (

                ) : (

                      title="Configure Gemini / OpenRouter AI Key"
                    >
                      <Icon name="key" className="w-3.5 h-3.5" />

                    </button>

                    <div className="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                      {["10", "12"].map((cls) => (

                          }`}

                      ))}
                    </div>
                  </>

              </div>
            </div>

            {/* Collapsible Universal OpenRouter / Gemini API Key Bar */}
            {aiSettingsOpen && activeTab !== "exam" && (

                    <input

                      placeholder="Student Name"
                      className="px-2.5 py-1.5 rounded-lg bg-indigo-900/80 border border-indigo-700 text-xs text-white w-28"
                    />
                    <button
                      onClick={() => setAiSettingsOpen(false)}
                      className="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-extrabold"
                    >
                      Done
                    </button>
                  </div>
                </div>
              </div>

          </header>

          {copyFeedback && (
            <div className="fixed top-20 right-4 z-50 bg-slate-900 text-white text-xs sm:text-sm px-4 py-3 rounded-xl shadow-lg flex items-center gap-2">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{copyFeedback}</span>
            </div>
          )}

          {/* MAIN VIEWPORT */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
            {/* ==================== 1. PRACTICE GENERATOR VIEW ==================== */}
            {activeTab === "practice" && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <div className="lg:col-span-7 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                        CBSE Class {classLevel} Subjects
                      </h1>
                      <p className="text-xs sm:text-sm text-slate-500">

                      </p>
                    </div>
                    <div className="flex items-center gap-2">
                      {activePaper && (
                        <button
                          onClick={() => setActiveTab("exam")}
                          className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-bold transition"
                        >

                          <span>Resume Test</span>
                        </button>
                      )}
                      <button
                        onClick={() => {
                          setActivePaper(null);

                          setSelectedFormats(["mcq", "ar", "competency", "short", "long"]);
                          setQuestionCount(Math.min(5, selectedSubject.maxQuestions));
                          setActiveTab("notes");
                        }}
                        className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-700 hover:text-rose-700 border border-slate-200 hover:border-rose-200 text-xs font-bold transition"
                        title="Exit Practice Section"
                      >

                        <span>Exit Practice</span>

                  {classLevel === "12" && (

                          key={stream}
                          onClick={() => setStreamFilter(stream)}
                          className={`px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border transition ${
                            streamFilter === stream
                              ? "bg-indigo-600 text-white border-indigo-600"
                              : "bg-white text-slate-600 border-slate-200 hover:border-indigo-300"
                          }`}
                        >
                          {stream}
                        </button>
                      ))}

                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {filteredSubjects.map((subj) => {

                        <div

                          onClick={() => {

                          className={`p-4 rounded-2xl border transition cursor-pointer flex flex-col justify-between ${

                                  >
                                    <div className="min-w-0">
                                      <div className="text-xs font-bold text-slate-800 group-hover:text-indigo-700 truncate">
                                        {lnk.source}
                                      </div>
                                      <div className="text-[11px] text-slate-500 truncate">{lnk.tag}</div>
                                    </div>
                                    <Icon name="external" className="w-3.5 h-3.5 text-slate-400 group-hover:text-indigo-600 shrink-0" />
                                  </a>
                                ))}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                )}
              </div>
            )}

            {/* ==================== 6. SAVED PAPERS ARCHIVE TAB ==================== */}
            {activeTab === "saved" && (
              <div className="space-y-4">
                <div>
                  <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">Saved Solved Papers</h1>
                  <p className="text-xs sm:text-sm text-slate-500">
                    Every attempted CBSE questionnaire is saved locally for instant revision and sharing.
                  </p>
                </div>

                {savedPapers.length === 0 ? (
                  <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center space-y-3">
                    <p className="text-sm font-semibold text-slate-600">You haven't solved any papers yet.</p>
                    <button
                      onClick={() => setActiveTab("practice")}
                      className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold"
                    >
                      Generate Your First Paper
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {savedPapers.map((paper) => (
                      <div key={paper.id} className="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col justify-between gap-4 shadow-sm">
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-1">
                            <span className="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">
                              Class {paper.classLevel} • Code {paper.subject.code}
                            </span>
                            <span className="text-xs text-slate-400">{paper.submittedAt}</span>
                          </div>
                          <h3 className="font-extrabold text-slate-900 text-lg">{paper.subject.name}</h3>
                          <div className="mt-3 grid grid-cols-3 gap-2 text-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <div>
                              <div className="text-[11px] text-slate-500">Score</div>
                              <div className="text-sm font-extrabold text-slate-900">{paper.totalScore}/{paper.maxMarks}</div>
                            </div>
                            <div>
                              <div className="text-[11px] text-slate-500">Accuracy</div>
                              <div className="text-sm font-extrabold text-emerald-700">{paper.accuracy}%</div>
                            </div>
                            <div>
                              <div className="text-[11px] text-slate-500">Time</div>
                              <div className="text-sm font-extrabold text-slate-900">{formatTime(paper.timeTaken)}</div>
                            </div>
                          </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
                          <button
                            onClick={() => {
                              setActiveResultId(paper.id);
                              setActiveTab("solutions");
                            }}
                            className="flex-1 py-2 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold"
                          >
                            View Solutions
                          </button>
                          <button
                            onClick={() => handleShareScore(paper)}
                            className="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold"
                          >
                            Share
                          </button>
                          <button
                            onClick={() => setSavedPapers((prev) => prev.filter((p) => p.id !== paper.id))}
                            className="p-2 rounded-xl text-rose-600 hover:bg-rose-50"
                            title="Delete Saved Paper"
                          >
                            <Icon name="trash" className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ==================== 7. COMPARE & SHARE WITH FRIENDS TAB ==================== */}
            {activeTab === "compare" && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm space-y-4">
                  <div>
                    <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                      Compare Performance with Friends
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-500">
                      Share your UTTAR challenge code or paste a friend's code to compare CBSE scores side-by-side.
                    </p>
                  </div>

                  <div className="flex flex-col sm:flex-row gap-2">
                    <input
                      type="text"
                      value={friendCodeInput}
                      onChange={(e) => setFriendCodeInput(e.target.value)}
                      placeholder="Paste friend's code (e.g. UTTAR-10-041-12OF14-ANANYA)"
                      className="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm font-mono focus:outline-none focus:border-indigo-600"
                    />
                    <button
                      onClick={handleImportFriendCode}
                      className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-bold"
                    >
                      Add Friend Score
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {activeResult && (
                    <div className="bg-indigo-50/70 rounded-2xl border-2 border-indigo-600 p-5 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-indigo-600 text-white">
                          You ({studentName})
                        </span>
                        <button
                          onClick={() => handleShareScore(activeResult)}
                          className="text-xs font-bold text-indigo-700 flex items-center gap-1 hover:underline"
                        >
                          <Icon name="copy" className="w-3.5 h-3.5" /> Copy Code
                        </button>
                      </div>
                      <h3 className="font-extrabold text-slate-900 text-lg">
                        Class {activeResult.classLevel} • {activeResult.subject.name}
                      </h3>
                      <div className="space-y-1.5">
                        <div className="flex justify-between text-xs font-bold">
                          <span>Score: {activeResult.totalScore}/{activeResult.maxMarks}</span>
                          <span>{Math.round((activeResult.totalScore / activeResult.maxMarks) * 100)}%</span>
                        </div>
                        <div className="w-full h-2.5 bg-indigo-200 rounded-full overflow-hidden">
                          <div
                            className="h-full bg-indigo-600 rounded-full"
                            style={{ width: `${Math.min(100, Math.round((activeResult.totalScore / activeResult.maxMarks) * 100))}%` }}
                          />
                        </div>
                      </div>
                    </div>
                  )}

                  {friendComparisons.map((friend) => {
                    const pct = Math.min(100, Math.round((friend.score / friend.maxMarks) * 100));
                    return (
                      <div key={friend.id} className="bg-white rounded-2xl border border-slate-200 p-5 space-y-3 shadow-sm">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                            Friend • {friend.name}
                          </span>
                          <span className="text-xs text-slate-400">Class {friend.classLevel}</span>
                        </div>
                        <h3 className="font-extrabold text-slate-900 text-lg">{friend.subjectName}</h3>
                        <div className="space-y-1.5">
                          <div className="flex justify-between text-xs font-bold">
                            <span>Score: {friend.score}/{friend.maxMarks}</span>
                            <span>{pct}%</span>
                          </div>
                          <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-emerald-500 rounded-full"
                              style={{ width: `${pct}%` }}
                            />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* Early Test Termination / Exit Confirmation Modal */}
          {exitConfirmOpen && activeTab === "exam" && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl border border-slate-200 max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-2.5 text-rose-700">
                  <div className="w-10 h-10 rounded-xl bg-rose-100 flex items-center justify-center shrink-0">
                    <Icon name="logOut" className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-base font-extrabold text-slate-900">Terminate Practice Test Early?</h3>
                    <p className="text-xs text-slate-500">
                      Answered {Object.keys(userAnswers).length} of {activePaper?.questions?.length || 0} questions ({formatTime(secondsElapsed)} elapsed)
                    </p>
                  </div>
                </div>
                <p className="text-xs sm:text-sm text-slate-600 leading-relaxed">
                  You can either <strong>Submit &amp; Score</strong> your attempted answers right now, or <strong>Terminate &amp; Exit</strong> back to the Practice section without saving.
                </p>
                <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-end gap-2 pt-2">
                  <button
                    onClick={() => setExitConfirmOpen(false)}
                    className="px-4 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-700 hover:bg-slate-50"
                  >
                    Continue Test
                  </button>
                  <button
                    onClick={() => {
                      setExitConfirmOpen(false);
                      handleSubmitExam();
                    }}
                    className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold"
                  >
                    Submit &amp; Score Now
                  </button>
                  <button
                    onClick={handleTerminateExamWithoutSaving}
                    className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold"
                  >
                    Terminate &amp; Exit
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Mobile Bottom Navigation Bar */}
          {activeTab !== "exam" && (
            <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 grid grid-cols-5 py-1.5">
              {[
                { id: "practice", label: "Practice", icon: "book" },
                { id: "notes", label: "AI Notes", icon: "notes" },
                { id: "solutions", label: "Solutions", icon: "lightbulb" },
                { id: "saved", label: "Saved", icon: "folder" },
                { id: "compare", label: "Compare", icon: "users" }
              ].map((item) => {
                const active = activeTab === item.id || (item.id === "practice" && activeTab === "scorecard");
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex flex-col items-center justify-center py-1 gap-0.5 text-[10px] font-bold ${
                      active ? "text-indigo-600" : "text-slate-500"
                    }`}
                  >
                    <Icon name={item.icon} className="w-5 h-5" />
                    <span>{item.label}</span>
                  </button>
                );
              })}
            </nav>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<UttarApp />);
  </script>
</body>
</html>
